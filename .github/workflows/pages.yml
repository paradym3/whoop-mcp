name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/update-site-stats.ts"
      - "tests/site-stats.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; skip queued runs in between.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify statistics generator
        run: |
          npm run site:check
          npx eslint scripts/update-site-stats.ts tests/site-stats.test.ts
          npm test -- tests/site-stats.test.ts tests/public-metadata.test.ts

      - name: Refresh public project statistics
        run: npm run site:stats
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
