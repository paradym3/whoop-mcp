name: Feature request
description: Suggest a question, workflow or improvement for whoop-ai-mcp.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please check [open requests](https://github.com/shashankswe2020-ux/whoop-mcp/issues?q=is%3Aissue+is%3Aopen+label%3Aenhancement) first. If yours is already there, add a 👍 to it so it's easier to prioritise.
  - type: textarea
    id: question
    attributes:
      label: What do you want to ask or do?
      description: Describe it the way you'd ask your assistant, if you can.
      placeholder: '"Did late workouts affect my sleep over the last month?"'
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today?
      description: What does your assistant answer now, and where does it fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: A new tool, a new parameter, a prompt template, a setup change, or something else. Rough ideas are fine.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Which area is this about?
      options:
        - Recovery, HRV or strain
        - Sleep
        - Workouts and training
        - Trends, baselines or comparisons
        - Setup and installation
        - Privacy or telemetry
        - Supporting another assistant
        - Something else
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Which assistant do you use?
      multiple: true
      options:
        - Claude Desktop
        - Claude Code
        - Codex
        - GitHub Copilot
        - Other
    validations:
      required: false
